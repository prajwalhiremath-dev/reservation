{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="wrapper">
    <section class="login-content">
        <div class="row m-0 align-items-center bg-white vh-100">
            <div class="col-md-6 offset-md-3">
                <div class="row justify-content-center">
                    <div class="col-md-10">
                        <div class="card card-transparent auth-card">
                            <div class="card-body">
                                <div class="text-center mb-4">
                                    <img src="{% static 'assets/images/cisco_new.gif' %}" class="mb-3" alt="Cisco Logo" height="50">
                                    <h2 class="mb-2">Sign In</h2>
                                    <p class="text-secondary">Login to continue to Testbed Reservation</p>
                                </div>

                                {% if messages %}
                                    {% for message in messages %}
                                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                                            {{ message }}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                        </div>
                                    {% endfor %}
                                {% endif %}

                                <form method="post" action="{% url 'login' %}">
                                    {% csrf_token %}
                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="form-group">
                                                <label class="form-label">Username</label>
                                                <input type="text" class="form-control" name="username" required>
                                            </div>
                                        </div>
                                        <div class="col-lg-12">
                                            <div class="form-group">
                                                <label class="form-label">Passcode</label>
                                                <input type="password" class="form-control" name="password" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-center mt-4">
                                        <button type="submit" class="btn btn-primary mx-2">Sign In</button>
                                        <button type="button" class="btn btn-outline-primary mx-2" onclick="loginAsGuest()">Guest User</button>
                                    </div>
                                    <div class="text-center mt-4">
                                        <p class="mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary">Register here</a></p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
function loginAsGuest() {
    document.querySelector('input[name="username"]').value = 'guest';
    document.querySelector('input[name="password"]').value = 'Guestuser@12345';
    document.querySelector('form').submit();
}
</script>
{% endblock %}
